[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-finance-research-backend"
version = "0.1.0"
description = "Backend foundation for agentic-finance-research."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "asyncpg>=0.30,<1.0",
  "fastapi>=0.115,<1.0",
  "langchain>=0.3,<1.0",
  "langgraph>=0.2,<1.0",
  "langsmith>=0.2,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "uvicorn[standard]>=0.32,<1.0",
  "PyMuPDF>=1.27,<2.0",
  "supabase>=2.0,<3.0",
  "sentence-transformers>=3.3,<6.0",
  "langchain-openai>=0.3.35",
  "langchain-groq>=0.2,<1.0",
  "python-multipart>=0.0.20,<1.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1.0",
  "mypy>=1.13,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.8,<1.0",
  "numpy>=2.0,<3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["app", "tests"]
strict = true
warn_unused_ignores = true

[tool.hatch.build.targets.wheel]
packages = ["app"]
[[tool.mypy.overrides]]
module = ["fitz"]
ignore_missing_imports = true
